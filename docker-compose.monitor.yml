version: '3.8'

services:
  # ============================================
  # PROMETHEUS - Metrics Collection
  # ============================================
  prometheus:
    image: prom/prometheus:latest           # Official Prometheus image [citation:1][citation:5]
    container_name: prometheus
    ports:
      - "9090:9090"                         # Web UI: http://localhost:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus         # Persistent storage
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'  # Keep data for 90 days
    restart: unless-stopped
    networks:
      - monitoring-network

  # ============================================
  # GRAFANA - Visualization Dashboard
  # ============================================
  grafana:
    image: grafana/grafana:latest           # Official Grafana image [citation:1][citation:8]
    container_name: grafana
    ports:
      - "3000:3000"                         # Web UI: http://localhost:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin    # Change this in production!
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning  # Auto-configure datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring-network

  # ============================================
  # NODE EXPORTER - System metrics (CPU, Memory, Disk)
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    networks:
      - monitoring-network

  # ============================================
  # CADVISOR - Docker container metrics
  # ============================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped
    networks:
      - monitoring-network

  # ============================================
  # YOUR FLINK JOB (example)
  # ============================================
  # flink-job:
  #   build: ./flink-job
  #   ports:
  #     - "9250:9250"    # Prometheus metrics endpoint
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - monitoring-network

networks:
  monitoring-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: